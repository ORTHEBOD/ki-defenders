[build]
  publish = "."

# The service worker must always be re-checked, so phones pick up new versions of the game
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The online save / leaderboard server (netlify/functions/api.mjs), reached at /api/...
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
