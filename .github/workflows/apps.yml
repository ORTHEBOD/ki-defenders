# Builds the Android app and the PC app, then posts them on a GitHub Release.
# Run it from the Actions tab ("Build apps" -> Run workflow), or push a tag like v1.2.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build the Android app
        run: bash apps/android/build.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/android/out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the PC app
        shell: bash
        run: |
          cd apps/electron
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          mkdir -p game
          cp -r ../../index.html ../../manifest.webmanifest ../../lib ../../fonts ../../icons ../../src ../../art game/
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/electron/dist/KiDefenders-Setup.exe
            apps/electron/dist/KiDefenders-Portable.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Post the apps on a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ki Defenders apps 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Android: download ki-defenders.apk on the phone and open it (allow installing apps from your browser).
          PC: KiDefenders-Setup.exe installs the game; KiDefenders-Portable.exe runs without installing.
          Progress is saved online - log in with the same name and PIN as on the website.
          ki-defenders.aab is for the Google Play Store."
