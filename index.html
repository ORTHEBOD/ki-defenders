<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ki Defenders</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#10131c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    @font-face {
      font-family: 'Bangers';
      src: url('fonts/bangers.woff2') format('woff2');
      font-display: swap;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: #07090f; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    .kd-login { display: flex; flex-direction: column; gap: 16px; width: 440px; font-family: Bangers, 'Arial Black', sans-serif; }
    .kd-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .kd-chip { font: inherit; font-size: 22px; padding: 6px 16px; border-radius: 20px; border: 2px solid #ffd93b; background: #2a3350; color: #fff; cursor: pointer; }
    .kd-input { font: inherit; font-size: 30px; padding: 12px 18px; border-radius: 10px; border: 3px solid #3a4470; background: #0b0e16; color: #fff; outline: none; letter-spacing: 1px; }
    .kd-input:focus { border-color: #ffd93b; }
    .kd-error { min-height: 26px; color: #ff6b6b; font-size: 22px; text-align: center; }
    .kd-go { font: inherit; font-size: 36px; padding: 12px; border-radius: 12px; border: 3px solid #10131c; background: #e0661a; color: #fff; cursor: pointer; text-shadow: 2px 2px 0 #10131c; }
    .kd-go:active { transform: scale(0.97); }
    .kd-or { display: flex; align-items: center; gap: 12px; color: #9aa3c7; font-size: 22px; }
    .kd-or::before, .kd-or::after { content: ''; flex: 1; height: 2px; background: #3a4470; }
    .kd-google { display: flex; justify-content: center; min-height: 44px; }
    .kd-gbtn { font: 22px Roboto, Arial, sans-serif; font-weight: 600; width: 100%; padding: 10px; border-radius: 24px; border: 0; background: #1a73e8; color: #fff; cursor: pointer; }
    .kd-gbtn b { display: inline-block; width: 30px; height: 30px; line-height: 30px; margin-right: 10px; border-radius: 50%; background: #fff; color: #1a73e8; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
